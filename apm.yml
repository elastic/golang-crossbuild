name: golang-crossbuild
version: 1.0.0

targets:
  - copilot

# Agent Package Manager (https://microsoft.github.io/apm/)
# Declares agent skills for this repository.
#
# Skills live in .apm/skills/ and follow the APM standard primitive layout.
#
# LOCAL USAGE — deploy to your AI tool:
#   apm install
#   → Claude Code  : .claude/skills/debug-build/
#   → Cursor       : .cursor/rules/debug-build.mdc
#   → GitHub Copilot: .github/
#   (The Claude Code wrapper in .claude/skills/ is pre-installed with Claude-specific
#    enhancements and loads the skill body from .apm/skills/ at runtime.)
#
# SCHEDULED AW — obs:repo-scheduled reads x-oblt-aw below. The scheduled brief is
#   .github/oblt-aw/scheduled/debug-build-report.md; skill + issue format stay in
#   .apm/ and are imported via obs.fragments → additional-instructions-fragments.
# LOCAL IDE — dependencies.apm still installs the debug-build skill for humans.

dependencies:
  apm:
    - path: ./.apm/skills/debug-build

x-oblt-aw:
  version: 1
  obs:
    fragments:
      build-debug-issue: .apm/instructions/build-debug-issue.instructions.md
      debug-build: .apm/skills/debug-build/SKILL.md
    common: {}
    workflows:
      repo-scheduled:
        additional-instructions-fragments:
          - debug-build
          - build-debug-issue
        automations:
          - id: debug-build-report
            instructions-file: .github/oblt-aw/scheduled/debug-build-report.md
            schedule-profiles: [weekly]
            capabilities: [buildkite-logs]
