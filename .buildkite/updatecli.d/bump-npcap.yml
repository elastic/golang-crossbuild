---
name: Bump npcap version in Makefile.common
pipelineid: 'bump-npcap-{{ source "latestNpcapVersion" }}'

# NOTE: this config is applied from a Buildkite step
# (.buildkite/scripts/run-updatecli.sh) via bump-npcap-pipeline.yml.
# It lives in .buildkite/updatecli.d/ (not .github/updatecli.d/) so it is
# not picked up by the bump-golang GitHub Actions workflow, which scans the
# .github/updatecli.d/ directory. GITHUB_TOKEN is provided by the
# elastic/vault-github-token Buildkite plugin (configure-git-user: true),
# which also configures the elastic-ci[bot] git identity.
#
# The target branch, title prefix, backport label and extra description are
# provided via --values: values.d/main.yml for the main branch, or a values
# file generated per target by .buildkite/scripts/bump-npcap-backports.sh.

scms:
  githubConfig:
    kind: github
    spec:
      user: 'elastic-ci[bot]'
      username: 'elastic-ci[bot]'
      owner: elastic
      repository: golang-crossbuild
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      branch: '{{ .branch }}'
      commitusingapi: true

actions:
  default:
    title: '{{ .title_prefix }}Bump npcap to version {{ source "latestNpcapVersion" }}'
    kind: github/pullrequest
    scmid: githubConfig
    spec:
      automerge: false
      labels:
        - automation
        - dependencies
        - '{{ .backport_label }}'
      description: |
        Bumps the npcap OEM installer to v{{ source "latestNpcapVersion" }}.
        The artifact has been uploaded to the private GCS store by this automation.

        https://github.com/nmap/npcap/releases/tag/v{{ source "latestNpcapVersion" }}
        {{ .description_note }}

sources:
  latestNpcapVersion:
    name: Get latest npcap release
    kind: githubrelease
    transformers:
      - trimprefix: v
    spec:
      owner: nmap
      repository: npcap
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      username: 'elastic-ci[bot]'
      versionfilter:
        kind: latest

conditions:
  isNewVersion:
    name: 'Is NPCAP_VERSION already {{ source "latestNpcapVersion" }} in Makefile.common?'
    disablesourceinput: true
    scmid: githubConfig
    kind: file
    spec:
      file: Makefile.common
      matchpattern: '(?m)^NPCAP_VERSION := {{ source "latestNpcapVersion" }}$'
    failwhen: true

targets:
  update-makefile-common:
    name: "Update NPCAP_VERSION in Makefile.common"
    sourceid: latestNpcapVersion
    scmid: githubConfig
    kind: file
    spec:
      file: Makefile.common
      matchpattern: 'NPCAP_VERSION := \d+\.\d+'
      content: 'NPCAP_VERSION := {{ source "latestNpcapVersion" }}'
