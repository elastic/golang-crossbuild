---
version: 2
updates:

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    exclude-paths:
      - "**/*.lock.yml"
      - ".github/workflows/agentics-maintenance.yml"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "22:00"
    groups:
      github-actions:
        patterns:
          - "*"
