---
name: ci-agentic-workflows

on:
  # NOTE: only for testing feature/recompile branch
  push:
    branches:
      - feature/recompile
  # END NOTE
  pull_request:
    branches:
      - main
    paths:
      - '.apm/**'
      - '.github/workflows/ci-agentic-workflows.yml'
      - '.github/workflows/*.md'
      - '.github/workflows/.lock.yml'
      - '.github/workflows/shared/**'
      - '.aw-compiler-version'
      - 'gh-aw.mak'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: make compile-aw-check
